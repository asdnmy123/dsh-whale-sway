# ============================================================================
# dsh-whale-sway —— DSH bundle patch
# ============================================================================
# The plugin's "mount declaration": DSH stacks every bundle layer's patch at
# startup, and this file inserts this plugin's one Loader row.
#
# The client half is discovered from `dsh.client` in package.json, so the row
# itself is bare: no config, no services, no build step.
#
# Install, one command (see the README "安装" section):
#   dsh plugin --profile <profile> add github:asdnmy123/dsh-whale-sway#v0.3.0
# from a local checkout instead:
#   dsh plugin --profile <profile> add link:<absolute path to this directory>
# of a published copy (shorter still):
#   dsh plugin --profile <profile> add dsh-whale-sway
#
# `dsh plugin` forwards to pnpm inside the profile and appends this package to
# `dsh.profile.bundles` because it declares `dsh.bundle`. There is no build
# script here, so a git install needs no pnpm build allowance.
# ============================================================================

- insert:
    - id: dsh-whale-sway
      name: dsh-whale-sway
